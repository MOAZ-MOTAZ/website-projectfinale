name: Deploy Client to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Remove patchedDependencies from all package.json files
        run: |
          node -e "
            const fs = require('fs');
            ['./package.json', './client/package.json'].forEach(p => {
              if (fs.existsSync(p)) {
                const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
                if (pkg.pnpm && pkg.pnpm.patchedDependencies) {
                  delete pkg.pnpm.patchedDependencies;
                }
                fs.writeFileSync(p, JSON.stringify(pkg, null, 2));
                console.log('Cleaned:', p);
              }
            });
          "

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: ./client

      - name: Build project
        run: npx vite build --config ../vite.config.ts --outDir ../dist
        working-directory: ./client

      - name: List files after build
        run: ls -la && ls -la dist || echo "No dist in root"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload dist folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
